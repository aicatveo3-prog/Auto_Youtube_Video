name: Build static site

# 외부 AI(또는 사람)가 자막/정리본을 저장소에 커밋하면, GitHub가 스스로
# 정적 사이트(docs/)를 다시 빌드해서 Pages 뷰어를 최신으로 만든다.
# 로컬 PC 없이도 정리본이 사이트에 반영되게 하는 마지막 연결 고리.

on:
  push:
    branches: [main]
    # docs/** 는 트리거에서 제외. 이 워크플로가 커밋하는 건 오직 docs/** 뿐이라
    # 여기에 포함하면 자기 커밋이 자기를 다시 부르는 무한 루프가 된다.
    paths:
      - 'transcripts/**'
      - 'channels/**'
      - 'prompts/**'
      - 'articles/**'
      - 'web/**'
      - 'scripts/build_site.py'

# 워크플로가 docs/ 를 커밋해 되돌려 밀 수 있도록 쓰기 권한 부여.
permissions:
  contents: write

# 겹쳐 도는 것 방지 (여러 커밋이 몰려도 순차 처리).
concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild docs/
        run: python scripts/build_site.py

      - name: Commit & push if docs/ changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs)" ]; then
            git add docs
            # [skip ci] 로 이 커밋이 다른 워크플로를 다시 트리거하지 않게 이중 방어.
            git commit -m "auto: rebuild static site [skip ci]"
            git push
            echo "docs/ 재빌드 후 반영 완료"
          else
            echo "docs/ 이미 최신 — 변경 없음"
          fi
